name: CD — Release (Build, Push & Update ArgoCD)

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   - A semver tag is pushed (created by ci-main.yml)
#     e.g. v1.2.3
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write     # update argocd-app/application.yaml via git
  packages: write     # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/hlaingminpaing

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build & push all service images in parallel
  # ──────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ui
            context: src/ui
          - service: catalog
            context: src/catalog
          - service: cart
            context: src/cart
          - service: orders
            context: src/orders
          - service: checkout
            context: src/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/retail-store-sample-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ──────────────────────────────────────────────────────────────────────────
  # Update the ArgoCD Application manifest with the new image tag
  # ArgoCD auto-sync will detect the change and deploy
  # ──────────────────────────────────────────────────────────────────────────
  update-argocd:
    name: Update ArgoCD Image Tag
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semver tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update imageTag in argocd-app/application.yaml
        run: |
          sed -i "s|imageTag: .*|imageTag: ${VERSION}|g" argocd-app/application.yaml

      - name: Commit and push updated manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(argocd): update imageTag to ${VERSION} [skip ci]"
          file_pattern: argocd-app/application.yaml
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

  # ──────────────────────────────────────────────────────────────────────────
  # Create a GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true

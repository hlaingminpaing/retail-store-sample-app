# =============================================================================
# Retail Store Helm Chart — Default Values
# =============================================================================

# -- Global image registry prefix. Override to point at your own registry.
global:
  imageRegistry: ghcr.io/hlaingminpaing
  imagePullPolicy: Always
  # -- Image tag applied to ALL services (can be overridden per-service).
  imageTag: latest
  # -- Kubernetes namespace (chart will deploy here when --create-namespace is used).
  namespace: retail-store

# =============================================================================
# UI Service (Spring Boot / Java 21)
# =============================================================================
ui:
  enabled: true
  replicaCount: 2
  image:
    repository: retail-store-sample-ui
    # tag: ""  # defaults to global.imageTag

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    # AWS ALB Ingress — requires AWS Load Balancer Controller on EKS
    # https://docs.aws.amazon.com/eks/latest/userguide/aws-load-balancer-controller.html
    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/load-balancer-name: retail-store-alb
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      # Uncomment when you have an ACM certificate:
      # alb.ingress.kubernetes.io/ssl-redirect: "443"
      # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/CERT-ID
      alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
      alb.ingress.kubernetes.io/healthy-threshold-count: "2"
      alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
      alb.ingress.kubernetes.io/tags: app=retail-store,managed-by=helm
    host: retail-store.example.com   # <-- change to your domain
    tls: []
    # tls:
    #   - secretName: retail-store-tls
    #     hosts:
    #       - retail-store.example.com

  env:
    JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
    SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
    SPRING_PROFILES_ACTIVE: "prod"
    RETAIL_UI_SEARCH_ENABLED: "false"

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 40
    periodSeconds: 30

# =============================================================================
# Catalog Service (Go / Gin)
# =============================================================================
catalog:
  enabled: true
  replicaCount: 2
  image:
    repository: retail-store-sample-catalog

  service:
    type: ClusterIP
    port: 80

  env:
    GIN_MODE: release
    RETAIL_CATALOG_SEARCH_ENABLED: "false"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30

# ── catalog-db (MariaDB) ──────────────────────────────────────────────────────
catalogDb:
  enabled: true
  image:
    repository: mariadb
    tag: "10.9"
    pullPolicy: IfNotPresent
  database: catalogdb
  username: catalog_user
  # Password is stored in a Secret. Override via --set catalogDb.password=<val>
  password: "changeme"
  persistence:
    enabled: true
    storageClass: ebs-gp3   # AWS EBS gp3 via EBS CSI driver
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# Cart Service (Spring Boot / Java 21)
# =============================================================================
cart:
  enabled: true
  replicaCount: 2
  image:
    repository: retail-store-sample-cart

  service:
    type: ClusterIP
    port: 80

  env:
    SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
    RETAIL_CART_PERSISTENCE_PROVIDER: dynamodb
    RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "true"
    AWS_ACCESS_KEY_ID: key
    AWS_SECRET_ACCESS_KEY: dummy
    AWS_DEFAULT_REGION: us-east-1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 40
    periodSeconds: 30

# ── carts-db (DynamoDB Local) ─────────────────────────────────────────────────
cartsDb:
  enabled: true
  image:
    repository: amazon/dynamodb-local
    tag: "1.20.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

# =============================================================================
# Orders Service (Spring Boot / Java 21)
# =============================================================================
orders:
  enabled: true
  replicaCount: 2
  image:
    repository: retail-store-sample-orders

  service:
    type: ClusterIP
    port: 80

  env:
    SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
    SPRING_PROFILES_ACTIVE: prod
    RETAIL_ORDERS_PERSISTENCE_PROVIDER: postgres
    RETAIL_ORDERS_PERSISTENCE_NAME: orders
    RETAIL_ORDERS_PERSISTENCE_USERNAME: orders_user
    RETAIL_ORDERS_MESSAGING_PROVIDER: rabbitmq
    RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME: rabbitmq

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 30

# ── orders-db (PostgreSQL) ────────────────────────────────────────────────────
ordersDb:
  enabled: true
  image:
    repository: postgres
    tag: "16.1"
    pullPolicy: IfNotPresent
  database: orders
  username: orders_user
  password: "changeme"
  persistence:
    enabled: true
    storageClass: ebs-gp3   # AWS EBS gp3 via EBS CSI driver
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── rabbitmq ──────────────────────────────────────────────────────────────────
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3-management"
    pullPolicy: IfNotPresent
  username: rabbitmq
  password: "changeme"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# Checkout Service (Node.js / NestJS)
# =============================================================================
checkout:
  enabled: true
  replicaCount: 2
  image:
    repository: retail-store-sample-checkout

  service:
    type: ClusterIP
    port: 80

  env:
    RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30

# ── checkout-redis ────────────────────────────────────────────────────────────
checkoutRedis:
  enabled: true
  image:
    repository: redis
    tag: "6.0-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

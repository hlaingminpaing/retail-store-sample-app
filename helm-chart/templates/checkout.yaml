{{- if .Values.checkoutRedis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    {{- include "retail-store.selectorLabels" (dict "name" "checkout-redis" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "retail-store.selectorLabels" (dict "name" "checkout-redis" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "retail-store.selectorLabels" (dict "name" "checkout-redis" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.checkoutRedis.image.repository }}:{{ .Values.checkoutRedis.image.tag }}"
          imagePullPolicy: {{ .Values.checkoutRedis.image.pullPolicy }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.checkoutRedis.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    {{- include "retail-store.selectorLabels" (dict "name" "checkout-redis" "context" .) | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}

{{- if .Values.checkout.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    {{- include "retail-store.selectorLabels" (dict "name" "checkout" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.checkout.replicaCount }}
  selector:
    matchLabels:
      {{- include "retail-store.selectorLabels" (dict "name" "checkout" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "retail-store.selectorLabels" (dict "name" "checkout" "context" .) | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: checkout
          image: {{ include "retail-store.appImage" (dict "repo" .Values.checkout.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
          env:
            {{- range $key, $val := .Values.checkout.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
              value: redis://checkout-redis:6379
            - name: RETAIL_CHECKOUT_ORDERS_URL
              value: http://orders/orders
          readinessProbe:
            {{- toYaml .Values.checkout.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.checkout.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.checkout.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    {{- include "retail-store.selectorLabels" (dict "name" "checkout" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.checkout.service.port }}
      targetPort: 8080
{{- end }}
